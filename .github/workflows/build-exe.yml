name: Build Windows EXE

on:
push:
tags:
  - "v*"

jobs:
build:
runs-on: windows-latest
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    shell: pwsh
    run: |
      python -m pip install --upgrade pip
      if (Test-Path "requirements.txt") { pip install -r requirements.txt }
      pip install pyinstaller PyQt5 python-dotenv yfinance gtts miniaudio psutil pypresence google-genai numpy pywin32

  - name: Build with PyInstaller
    shell: pwsh
    run: |
      pyinstaller --noconfirm DesktopPet.spec
      if (Test-Path "pet_save.json") { Copy-Item "pet_save.json" "dist\DesktopPet\pet_save.json" -Force }
      if (Test-Path "assets") { Copy-Item "assets" "dist\DesktopPet\assets" -Recurse -Force }

  - name: Zip build output
    shell: pwsh
    run: |
      Compress-Archive -Path "dist\DesktopPet\*" -DestinationPath "DesktopPet-windows.zip" -Force

  - name: Upload to GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      files: DesktopPet-windows.zip
