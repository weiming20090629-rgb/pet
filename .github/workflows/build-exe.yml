name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if exist requirements.txt pip install -r requirements.txt
          pip install pyinstaller PyQt5 python-dotenv yfinance gtts miniaudio psutil pypresence

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm DesktopPet.spec
          if exist pet_save.json copy pet_save.json dist\DesktopPet\pet_save.json
          if exist assets xcopy /E /I /Y assets dist\DesktopPet\assets

      - name: Zip build output
        run: |
          Compress-Archive -Path dist\DesktopPet\* -DestinationPath DesktopPet-windows.zip -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopPet-windows.zip